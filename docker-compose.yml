services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Your_password123}
    ports: ["1433:1433"]
  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: Server=db;Database=ChatEval;User Id=sa;Password=${SA_PASSWORD:-Your_password123};TrustServerCertificate=True
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8080:8080"]
    depends_on: [db]
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
