services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ACCESS_CODE: ${ACCESS_CODE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/app/data
volumes:
  data: {}
